[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bublik-private-ai-service"
version = "0.8.0"
description = "AI Advent Day 30: private local AI service (stages 1–8)"
requires-python = ">=3.13"
dependencies = ["httpx==0.28.1", "fastapi==0.143.0", "uvicorn==0.54.0", "argon2-cffi==25.1.0"]

[tool.setuptools.packages.find]
include = ["bublik_service*"]

[tool.setuptools.package-data]
"bublik_service.storage" = ["migrations/*.sql"]
"bublik_service" = ["web_ui/*.html", "web_ui/*.css", "web_ui/*.js", "web_ui/*.png", "web_ui/*.webmanifest"]
