[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bublik-developer-assistant"
version = "0.7.28"
description = "AI Advent Day 31: scoped read-only developer tools"
requires-python = ">=3.13"
dependencies = ["mcp==1.30.0", "jsonschema==4.26.0"]

[project.scripts]
bublik-developer = "bublik_developer.cli:main"

[tool.setuptools.packages.find]
include = ["bublik_developer*"]
